spring.application.name=ai-english-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ai_english?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=change-me
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# DeepSeek
# 推荐通过环境变量 DEEPSEEK_API_KEY 注入，不要把真实 Key 写进仓库。
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.model=deepseek-chat

# JWT（至少 32 个字符）
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=604800000

# Frontend origin
app.cors.allowed-origin=http://localhost:5173
